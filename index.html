const SEC={rect:['Rectangular (hormigón / maciza)',['b','Ancho b'],['h','Canto h']],T:['Viga T (hormigón)',['bf','Ancho del ala bf'],['hf','Espesor del ala hf'],['bw','Ancho del alma bw'],['h','Canto total h']],circ:['Circular maciza',['Dm','Diámetro D']],I:['Perfil I (acero)',['d','Canto d'],['bf','Ancho del ala bf'],['tf','Espesor del ala tf'],['tw','Espesor del alma tw']],tubR:['Tubo rectangular (acero)',['b','Ancho b'],['h','Canto h'],['tt','Espesor t']],tubC:['Tubo circular (acero)',['Dm','Diámetro D'],['tt','Espesor t']],poly:['Irregular (polígono)']};
const circ=(r,n=28)=>Array.from({length:n},(_,i)=>[r*Math.cos(2*Math.PI*i/n),r*Math.sin(2*Math.PI*i/n)]);
function pa(P){let A=0,Sy=0,Ix=0;for(let i=0;i<P.length;i++){const[a,b]=P[i],[c,d]=P[(i+1)%P.length],cr=a*d-c*b;A+=cr/2;Sy+=(b+d)*cr/6;Ix+=cr*(b*b+b*d+d*d)/12}return A<0?{A:-A,cy:Sy/A,Ix:-Ix}:{A,cy:Sy/A,Ix}}
function secRings(r){const b=r.b,h=r.h;switch(r.ty){
 case 'T':{const x=(r.bf-r.bw)/2,y=r.h-r.hf;return[[[[x,0],[x+r.bw,0],[x+r.bw,y],[r.bf,y],[r.bf,r.h],[0,r.h],[0,y],[x,y]],1]]}
 case 'circ':return[[circ(r.Dm/2),1]];
 case 'I':{const x=(r.bf-r.tw)/2,d=r.d,t=r.tf;return[[[[0,0],[r.bf,0],[r.bf,t],[x+r.tw,t],[x+r.tw,d-t],[r.bf,d-t],[r.bf,d],[0,d],[0,d-t],[x,d-t],[x,t],[0,t]],1]]}
 case 'tubR':{const t=r.tt;return[[[[0,0],[b,0],[b,h],[0,h]],1],[[[t,t],[b-t,t],[b-t,h-t],[t,h-t]],-1]]}

 R.forEach(([P,s])=>{const q=pa(P);A+=s*q.A;Sy+=s*q.A*q.cy;Io+=s*q.Ix;if(s>0)P.forEach(([x,y])=>{y0=Math.min(y0,y);y1=Math.max(y1,y);x0=Math.min(x0,x);x1=Math.max(x1,x)})});

 const cy=Sy/A;let I=Io-A*cy*cy;
 if(r.ty=='circ'){A=Math.PI*r.Dm**2/4;I=Math.PI*r.Dm**4/64}

 const fl=o.ty=='poly'?'<label style="display:block">Vértices x, y ('+UL('s')+'), uno por línea, en sentido continuo<textarea data-m="pts" rows="5" style="width:100%;box-sizing:border-box">'+o.pts.map(q=>fmtv(q[0]*UF('s'))+', '+fmtv(q[1]*UF('s'))).join('\n')+'</textarea></label>':T.slice(1).map(([k,l])=>'<label>'+l+' ('+UL('s')+')<input type="number" step="any" data-k="'+k+'" data-d="s" value="'+fmtv(o[k]*UF('s'))+'"></label>').join('');

function band(r,a,z,col){const s=sp(r),L=Math.hypot(z.x-a.x,z.y-a.y);if(L<1e-9)return;const ux=-(z.y-a.y)/L,uy=-(z.x-a.x)/L,x1=sx(a.x),y1=sy(a.y),x2=sx(z.x),y2=sy(z.y),t=Math.max(s.yt*V.s,1.5),b=Math.max(s.yb*V.s,1.5);

 if(mode=='model'){const k=Math.min(34/s.w,34/s.d),cx=(s.x0+s.x1)/2,cy=(s.y0+s.y1)/2,px=(x1+x2)/2+ux*(t+30),py=(y1+y2)/2+uy*(t+30);g.globalAlpha=.85;g.fillStyle=col;g.beginPath();

const FN=[['sup','Apoyo','s'],['fx','Fx (→+)','n','F'],['fy','Fy (↑+)','n','F'],['mz','Mz (↺+)','n','FL']];
const FB=[['E','E','n','E'],['wa','w inicio (↓+)','n','q'],['wb','w final (↓+)','n','q'],['la','wx inicio (→+)','n','q'],['lb','wx final (→+)','n','q'],['ka','ks inicio','n','k'],['kb','ks final','n','k'],['div','Subdivisiones','n',''],['r1','Articulación inicio','c'],['r2','Articulación final','c']];

/* ---------- Elemento viga 2D sobre fundación Winkler ---------- */
const GP=[[.0694318442029737,.173927422568727],[.330009478207572,.326072577431273],[.669990521792428,.326072577431273],[.930568155797026,.173927422568727]];
const hm=(x,L)=>[1-3*x*x+2*x**3,L*(x-2*x*x+x**3),3*x*x-2*x**3,L*(x**3-x*x)];
function kloc(E,A,I,L,ka,kb){const a=E*A/L,b=12*E*I/L**3,c=6*E*I/L**2,d=4*E*I/L,e=2*E*I/L;
 const K=[[a,0,0,-a,0,0],[0,b,c,0,-b,c],[0,c,d,0,-c,e],[-a,0,0,a,0,0],[0,-b,-c,0,b,-c],[0,c,e,0,-c,d]],ix=[1,2,4,5];

function analyze(){
 if(!B.length)return{err:'Dibuja al menos una barra.'};
 const nd=N.map(n=>({x:n.x,y:n.y})),E=[],used=new Set();

 const n=nd.length*3,G=Array.from({length:n},()=>Array(n).fill(0)),F=Array(n).fill(0);

 N.forEach((m,i)=>{F[3*i]+=m.fx;F[3*i+1]+=m.fy;F[3*i+2]+=m.mz});
 const rs=Array(n).fill(0);N.forEach((m,i)=>{const t=SUP[m.sup]||[0,0,0];for(let k=0;k<3;k++)rs[3*i+k]=used.has(i)?t[k]:1});
 let mx=0;for(let i=0;i<n;i++)mx=Math.max(mx,G[i][i]);for(let d=2;d<n;d+=3)if(G[d][d]<1e-9*mx)G[d][d]+=1e-9*mx;

  for(let m=0;m<=M;m++){const x=m/M,ss=L*m/M,h=L/M,Nn=hm(x,L),v=Nn[0]*ul[1]+Nn[1]*ul[2]+Nn[2]*ul[4]+Nn[3]*ul[5],uu=ul[0]*(1-x)+ul[3]*x;
